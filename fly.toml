# fly.toml — Configuration Fly.io pour HANI-MD
# Plateforme: https://fly.io (gratuit — 3 VMs nano toujours actives)

app = "hani-md"
primary_region = "cdg"   # Paris (plus proche de la Côte d'Ivoire)

[build]
  builder = "heroku/buildpacks:20"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = false   # IMPORTANT: ne jamais s'arrêter
  auto_start_machines = true
  min_machines_running = 1      # Toujours 1 instance active

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size   = "shared-cpu-1x"   # Instance nano gratuite
  memory = "256mb"
