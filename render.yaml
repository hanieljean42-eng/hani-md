services:
  - type: web
    name: hani-md
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: apt-get install -y ffmpeg 2>/dev/null || true; npm install --legacy-peer-deps --no-optional --omit=dev --ignore-scripts
    startCommand: node start.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: BOT_NAME
        value: "HANI-MD"
      - key: PREFIX
        value: "."
      - key: NUMERO_OWNER
        value: "22550252467"
      - key: PORT
        value: "3000"
      - key: FIREBASE_URL
        value: "https://hani-83025-default-rtdb.firebaseio.com"
      - key: BOT_URL
        value: "https://hani-tp3e.onrender.com"
      - key: SITE_URL
        value: "https://hani-tp3e.onrender.com"
      - key: JEKO_PAYMENT_LINK
        value: "https://pay.jeko.africa/pl/2a5354be-710e-454e-8741-1b3d6beb5890"
      # Données sensibles → à définir dans le dashboard Render (sync: false)
      - key: SESSION_ID
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
