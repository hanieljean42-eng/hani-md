services:
  - type: web
    name: hani-md
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: NODE_OPTIONS="" npm install --legacy-peer-deps --ignore-optional --omit=dev
    startCommand: node start.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: BOT_NAME
        value: "HANI-MD"
      - key: PREFIX
        value: "."
      - key: NUMERO_OWNER
        value: "22550252467"
      - key: PORT
        value: "3000"
      - key: FIREBASE_URL
        value: "https://hani-md-default-rtdb.firebaseio.com"
      - key: BOT_URL
        value: "https://hani-md.onrender.com"
      - key: JEKO_PAYMENT_LINK
        value: "https://pay.jeko.africa/pl/2a5354be-710e-454e-8741-1b3d6beb5890"
      # SESSION_ID, FIREBASE_CREDENTIALS, ADMIN_PASSWORD, JWT_SECRET
      # → À configurer dans le dashboard Render (données sensibles)
